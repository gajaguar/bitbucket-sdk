[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bitbucket-unofficial-sdk"
version = "0.9.0"
description = "Unofficial, typed Python SDK for the Bitbucket Cloud REST API"
readme = "README.md"
license = "MIT"
authors = [
  { name = "G.A.JAGUAR", email = "dev@gajaguar.com" },
]
requires-python = ">=3.14"
keywords = ["bitbucket", "pull-requests", "sdk", "api-client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/gajaguar/bitbucket-sdk"
Repository = "https://github.com/gajaguar/bitbucket-sdk"
Issues = "https://github.com/gajaguar/bitbucket-sdk/issues"

[dependency-groups]
dev = [
  "conventional-git>=1.1",
  "mypy>=2.3.1",
  "pylint-gajaguar>=2.0",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "respx>=0.22",
  "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
anyio_mode = "auto"
markers = [
  "live: hits the real Bitbucket API (requires ATLASSIAN_USER_EMAIL, ATLASSIAN_API_TOKEN, BITBUCKET_WORKSPACE)",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 119
lint.select = ["ALL"]
lint.ignore = ["CPY", "D", "missing-trailing-comma"]
lint.isort.force-single-line = true
lint.isort.case-sensitive = true
lint.flake8-type-checking.runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "bitbucket.models.base.BitbucketModel",
]
lint.flake8-bugbear.extend-immutable-calls = ["pydantic.Field"]
lint.per-file-ignores."tests/**/*.py" = ["ANN", "assert", "magic-value-comparison"]
lint.per-file-ignores."src/bitbucket/**/commits.py" = ["too-many-public-methods"]
lint.per-file-ignores."src/bitbucket/**/pull_requests.py" = ["too-many-public-methods"]

[tool.mypy]
strict = true
exclude = ["tests/"]

[tool.pyright]
include = ["src"]

[tool.pylint.main]
load-plugins = ["pylint_gajaguar"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["gajaguar"]

[tool.hatch.build.targets.wheel]
packages = ["src/bitbucket"]
